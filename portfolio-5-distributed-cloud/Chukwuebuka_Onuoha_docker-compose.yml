# ECEWS SPEED Osun Hub - PostgreSQL primary + streaming hot-standby replica
#   docker compose up -d          # primary loads schema + seed, replica clones it
#   ./replication_demo.sh > evidence/replication_output.txt 2>&1
#   docker compose down -v        # remove containers and data
name: speed-osun-replication

services:
  primary:
    image: postgres:16
    container_name: speed-primary
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: speed_osun
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=10
        -c max_replication_slots=10
        -c wal_keep_size=256MB
        -c hot_standby=on
    volumes:
      - ./primary-init/01-replication-user.sh:/docker-entrypoint-initdb.d/01-replication-user.sh:ro
      - ../portfolio-1-database-design/create_tables.sql:/docker-entrypoint-initdb.d/02-create_tables.sql:ro
      - ../portfolio-1-database-design/seed_data.sql:/docker-entrypoint-initdb.d/03-seed_data.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      # TCP check only succeeds after init scripts finish and the real server starts
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d speed_osun"]
      interval: 3s
      timeout: 3s
      retries: 60

  replica:
    image: postgres:16
    container_name: speed-replica
    user: postgres
    environment:
      PGPASSWORD: replpass
    depends_on:
      primary:
        condition: service_healthy
    # First start: clone the primary with pg_basebackup.
    #   -R writes standby.signal + primary_conninfo (starts as a hot standby)
    #   -C -S creates a physical replication slot so the primary keeps WAL
    #   the replica has not yet received.
    command:
      - bash
      - -c
      - |
        set -e
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          rm -rf "$$PGDATA"/*
          pg_basebackup -h primary -U replicator -D "$$PGDATA" -X stream -R -C -S replica_slot
          chmod 700 "$$PGDATA"
        fi
        exec postgres -c hot_standby=on
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 60
